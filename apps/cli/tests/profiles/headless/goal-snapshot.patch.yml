# Replay-backed goal patch over the shipped headless profile. The base
# composition no longer ships the model-facing goal tools, so this scenario
# pins the row back: it exercises persisted goal tools end to end.
- insert:
    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
