# Replay layer for the TypeScript SDK minimal customization patch. The base
# composition no longer ships the string editor; this scenario pins it back
# because the recorded model creates note.txt with it.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
