# Replay patch for the ralph composition: the base composition no longer
# ships the model-facing ralph tool, so this scenario pins it back through its
# own composition with the exact config the base row carried. The recorded
# model calls `ralph` once. The model script comes from the scenario's
# committed session JSONL.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
