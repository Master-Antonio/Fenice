# Replay patch for the workflow composition: the base composition no longer
# ships the model-facing workflow tool, so this scenario pins it back through
# its own composition. The recorded model calls `workflow` once. The model
# script comes from the scenario's committed session JSONL.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
