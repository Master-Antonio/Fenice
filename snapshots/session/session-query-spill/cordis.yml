# Local tool-result spill storage for the dedicated spill scenario. The
# session-query tool itself now rides the base composition; this overlay keeps
# only the private spill storage and its byte limit.

- id: spill-local
  name: '@deepseek-ai/dsh-spill-local'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: !!js process.env.DSH_SNAPSHOT && 800 || 50000

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.DSH_SNAPSHOT_SPILL_LOCATOR_ROOT

- insert:
    - id: query-spill-verification-path
      name: ./resolve-spill-command.mjs
